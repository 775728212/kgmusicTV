name: Build Android Release APK

# 触发条件：push 到 master/main 或打 tag，或手动在 Actions 页点 Run workflow
on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17（Gradle 9.x 最低要求）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Flutter 3.47.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      # ubuntu-latest 已预装整套 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk），
      # 但 sdkmanager 不一定在 PATH（镜像里是 cmdline-tools/16.0.0，没有 latest 软链），
      # 所以这里显式探测真实路径，不裸调命令。
      - name: 接受许可并补装 SDK 组件
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      # GitHub runner 在海外，把国内腾讯镜像还原成官方源，避免下载慢/失败
      - name: 还原官方源（替换腾讯镜像）
        run: |
          sed -i 's|mirrors.cloud.tencent.com/gradle/gradle-9.1.0-all.zip|services.gradle.org/distributions/gradle-9.1.0-all.zip|' \
            android/gradle/wrapper/gradle-wrapper.properties
          sed -i '/mirrors.cloud.tencent.com\/nexus/d' \
            android/settings.gradle.kts android/build.gradle.kts

      - name: 拉取依赖
        run: flutter pub get

      - name: 构建 Release APK
        run: flutter build apk --release

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: kugou-car-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
